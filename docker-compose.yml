version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: vibeclip-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: changeme
      POSTGRES_DB: vibeclip
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibeclip-network

  redis:
    image: redis:7-alpine
    container_name: vibeclip-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vibeclip-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vibeclip-backend
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:changeme@postgres:5432/vibeclip?schema=public
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      JWT_SECRET: dev-secret-key-change-in-production-at-least-32-chars-long
      JWT_REFRESH_SECRET: dev-refresh-key-change-in-production-at-least-32-chars-long
      FRONTEND_URL: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - ./uploads:/app/uploads
    networks:
      - vibeclip-network

  worker:
    build:
      context: ./worker
      dockerfile: Dockerfile
    container_name: vibeclip-worker
    environment:
      DATABASE_URL: postgresql://postgres:changeme@postgres:5432/vibeclip
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - vibeclip-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vibeclip-frontend
    environment:
      VITE_API_URL: http://localhost:5000
      VITE_API_VERSION: v1
      VITE_APP_NAME: VibeClip AI
      VITE_DEV_MODE: true
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - vibeclip-network

volumes:
  postgres_data:
  redis_data:

networks:
  vibeclip-network:
    driver: bridge